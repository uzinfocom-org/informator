[package]
name = "informator"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
homepage = "https://t.me/uzinformatorbot"
repository = "https://github.com/uzinfocom-org/informator"
description = "A telegram bot for managing announcements."
authors = ["Uzinfocom"]

# Dependencies that will included with final binary
[dependencies]
teloxide = { version = "0.17", features = [
  "macros",
  "webhooks",
  "webhooks-axum",
] }
log = "0.4"
pretty_env_logger = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
orzklv = { version = "0.2", features = ["full"] }
libxinux = { version = "0.2.3", features = ["pkgs-async"] }
clap = { version = "4", features = ["derive"] }
turso = "0.5.1"
thiserror = "2.0.18"

# Development dependencies which aren't used in release binary
[dev-dependencies]

# Optimize release binary as much as possible
[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
